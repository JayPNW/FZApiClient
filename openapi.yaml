openapi: 3.1.0
info:
  title: Frostreaver.zone API
  version: 0.1.0
  summary: Zone bonuses, raid parses, rankings and guilds for the Fangbreaker and Frostreaver EverQuest servers.
  description: |
    The API behind [fangbreaker.zone](https://fangbreaker.zone) and [frostreaver.zone](https://frostreaver.zone):

    - **Resource Hunter**: each zone's daily bonus, and its history.
    - **Raid parses**: encounter reports uploaded by fzClient, with rankings, characters and guild progression.
    - **Accounts and guilds**: the website's own features, behind a Discord login.

    ## Authentication

    Most reads are public. The rest use one of these:

    - **API key** (`X-API-Key` header): for programs like fzClient that upload on a user's behalf. Only the
      `/api/client/...` operations take it. Everything sent with a key counts as that user doing it on the website.
    - **Session cookie**: set when a user signs in on the website with Discord, through `GET /api/auth/discord`.
      Everything else that needs a signed-in user takes this.

    ## Hosts and servers

    Both hosts serve the same API and the same data for every server, so
    `https://frostreaver.zone/api/servers/fangbreaker/bonuses/today` works too.

    Each server has its own list of bonus types and its own list of zones, so always ask for the server you mean.
    `GET /api/servers` lists the servers.

    ## Envelope

    Every response body under `/api/` is JSON wrapped in an envelope:

    - Success: `{"ok": true, "data": ...}`
    - Failure: `{"ok": false, "error": "Human-readable message"}`

    `GET /api/health` is the one exception; see that operation.

    A request for a route that doesn't exist gets `404` with an error like `Route not found: GET /api/nope`.

    ## Names, not IDs

    A report names the server by its `name` from `GET /api/servers`, the zone by its `name` from
    `GET /api/servers/{server}/bonuses/zones`, and the bonus by its `key` from
    `GET /api/servers/{server}/bonuses/types`. Zone names in EverQuest's own log files often differ from these, so
    clients need their own mapping, and it has to be per server: the same log zone name can mean a different zone on
    each server.

    ## The bonus day

    A bonus is for one day, and days follow the calendar in the `America/Los_Angeles` time zone: a new day starts at
    midnight Pacific time, which is 08:00 UTC in winter and 07:00 UTC in summer. "Today" in this API means the current
    day by that clock, and `bonusDate` values are dates by that clock. Some responses give `bonusDate` as a date-time
    at midnight UTC, such as `2026-11-12T00:00:00.000Z`; its date part is the bonus day, and its time means nothing.

    ## Caching

    `GET` responses carry a weak `ETag`. Send it back in `If-None-Match` to get `304 Not Modified` with no body when
    nothing has changed. Responses have no `Cache-Control` header.

    ## Browsers

    Cross-origin browser requests are allowed only from the site's own origins, so a web page on another site can't
    call this API from the browser. Desktop programs, scripts and servers aren't affected.
  contact:
    name: Frostreaver.zone
    url: https://frostreaver.zone
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://frostreaver.zone
  - url: https://fangbreaker.zone
tags:
  - name: Status
    description: Is the API up?
  - name: Servers
    description: The EverQuest servers the site tracks.
  - name: Bonuses
    description: Resource Hunter's daily zone bonuses. Public, read-only.
  - name: Bonus moderation
    description: "The website's own bonus actions: reporting, removing, and flagging other users' actions. Needs a signed-in user."
  - name: Client
    description: Uploads from fzClient and similar programs. Needs an API key, and counts as the key's owner doing the same thing on the website.
  - name: Reports
    description: "Raid reports: the encounters uploaded from one raid night, and who took part."
  - name: Rankings
    description: Damage and healing rankings across uploaded encounters.
  - name: Characters
    description: EverQuest characters seen in uploaded encounters.
  - name: Guilds
    description: Guilds, their members and their uploads.
  - name: Progression
    description: Which raid bosses and objectives each guild has done.
  - name: Auth
    description: Signing in to the website with Discord.
  - name: Account
    description: The signed-in user's own settings, including their API key.
paths:
  /api/health:
    get:
      tags: [ Status ]
      operationId: getHealth
      security: []
      summary: Check that the API is up
      description: Unlike every other operation, the response has no `data`; it has `status` instead.
      responses:
        '200':
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                ok: true
                status: healthy
  /api/servers:
    get:
      tags: [ Servers ]
      operationId: getServers
      security: []
      summary: The EverQuest servers the site tracks
      responses:
        '200':
          description: The servers.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [ servers ]
                        properties:
                          servers:
                            type: array
                            items:
                              $ref: '#/components/schemas/Server'
              example:
                ok: true
                data:
                  servers:
                    - id: 1
                      name: Fangbreaker
                      slug: fangbreaker
                      aliases: []
                      isActive: true
                      createdAt: '2026-05-21T01:14:14.954Z'
                      updatedAt: '2026-05-28T06:15:54.288Z'
                    - id: 2
                      name: Frostreaver
                      slug: frostreaver
                      aliases: []
                      isActive: true
                      createdAt: '2026-05-21T01:14:18.474Z'
                      updatedAt: '2026-05-21T01:14:18.474Z'
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/servers/{server}/bonuses/types:
    get:
      tags: [ Bonuses ]
      operationId: getBonusTypes
      security: []
      summary: The kinds of bonus a zone can have on this server
      description: |
        Sorted by `sortOrder`. Includes `none`, for a zone that has no bonus today. Doesn't include `unconfirmed`, which
        only appears in `today`.

        A bonus type has the same `id` and `key` on every server; servers differ only in which types they have.
      parameters:
        - $ref: '#/components/parameters/Server'
      responses:
        '200':
          description: The server's bonus types.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/BonusType'
              example:
                ok: true
                data:
                  - id: 87b99f7c-af3e-4b01-96ed-b8ec015612f1
                    key: experience
                    label: Experience
                    sortOrder: 10
                  - id: 5cd4260c-9531-48d5-9b62-a9dfc9c6ed21
                    key: rare
                    label: Rare Spawn
                    sortOrder: 50
                  - id: 9c7c3f71-8094-44d9-b041-7df50b4e001e
                    key: none
                    label: No Bonus
                    sortOrder: 999
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/ServerNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/servers/{server}/bonuses/zones:
    get:
      tags: [ Bonuses ]
      operationId: getZones
      security: []
      summary: The zones that can have a bonus on this server
      description: |
        Each server has its own list, and the same place in the game can be a different zone on different servers,
        with its own `id`, `slug`, `name` and levels. For example, Fangbreaker has `Temple of Cazic-Thule (2.0)` and
        `Lair of the Splitpaw` where Frostreaver has `Temple of Cazic-Thule` and `Splitpaw`.
      parameters:
        - $ref: '#/components/parameters/Server'
      responses:
        '200':
          description: The server's zones.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Zone'
              example:
                ok: true
                data:
                  - id: c9b0852f-cacd-48f8-8cab-affb47b5b4c0
                    slug: befallen
                    name: Befallen
                    expansionId: 1d0ee73f-7e7a-46bf-b691-8d3424751ab5
                    expansion: Classic
                    expansionSlug: classic
                    minLevel: 5
                    maxLevel: 20
                    zoneType: Indoor
                    legacyZoneId: 2
                    isActive: true
                    createdAt: '2026-05-22T21:09:57.304Z'
                    updatedAt: '2026-05-22T21:09:57.304Z'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/ServerNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/servers/{server}/bonuses/today:
    get:
      tags: [ Bonuses ]
      operationId: getTodaysBonuses
      security: []
      summary: Today's bonus in every zone on this server
      description: |
        One entry for each of the server's zones, sorted by zone name, ignoring case. A zone nobody has reported today
        is still listed, with `bonus` set to `unconfirmed` and `state` set to `UNCONFIRMED`.

        Clients should tolerate a zone appearing more than once.

        Always today, in the sense of [the bonus day](#section/The-bonus-day); there's no parameter for another day.
      parameters:
        - $ref: '#/components/parameters/Server'
      responses:
        '200':
          description: Today's bonuses.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ZoneBonusToday'
              example:
                ok: true
                data:
                  - id: null
                    zoneId: 38bd03f2-006f-49c1-ab10-267831ec9760
                    zoneSlug: abysmal-sea
                    name: Abysmal Sea
                    expansion: Gates of Discord
                    expansionId: 2f8e1dd5-fddc-4aa1-b125-54f71e2eb1e3
                    expansionSlug: gates-of-discord
                    minLevel: 1
                    maxLevel: 75
                    zoneType: Outdoor
                    bonusTypeId: null
                    bonus: unconfirmed
                    bonusLabel: Unconfirmed
                    state: UNCONFIRMED
                    bonusDate: '2026-11-12'
                    pendingRemovalBy: null
                  - id: c460f872-a5c2-455f-b63f-22ed6edbd7f4
                    zoneId: 6488a2c2-e609-437d-8758-957e1b07732c
                    zoneSlug: acrylia-caverns
                    name: Acrylia Caverns
                    expansion: Shadows of Luclin
                    expansionId: c65e4be7-9f05-4381-86cd-6b03ec875bdc
                    expansionSlug: shadows-of-luclin
                    minLevel: 40
                    maxLevel: 60
                    zoneType: Indoor
                    bonusTypeId: 5cd4260c-9531-48d5-9b62-a9dfc9c6ed21
                    bonus: rare
                    bonusLabel: Rare Spawn
                    state: ACTIVE
                    bonusDate: '2026-11-12'
                    pendingRemovalBy: null
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/ServerNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/servers/{server}/bonuses/history/date:
    get:
      tags: [ Bonuses ]
      operationId: getBonusesOnDate
      security: []
      summary: Every zone's bonus on a past day
      description: |
        Like `today`, but for any day, and listing only zones someone reported that day. Removed bonuses aren't
        listed. Without `date`, the list is empty.
      parameters:
        - $ref: '#/components/parameters/Server'
        - name: date
          in: query
          description: The bonus day, in the sense of [the bonus day](#section/The-bonus-day).
          schema:
            type: string
            format: date
            examples: [ '2026-11-11' ]
      responses:
        '200':
          description: The bonuses reported that day.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ZoneBonusToday'
              example:
                ok: true
                data:
                  - id: c7868097-7266-42a4-a84e-87215dcf8d64
                    zoneId: 8de71326-2b5a-4db2-b5fa-348ff0ab24a8
                    zoneSlug: akanon
                    name: "Ak'Anon"
                    expansion: Classic
                    expansionId: 1d0ee73f-7e7a-46bf-b691-8d3424751ab5
                    expansionSlug: classic
                    minLevel: 1
                    maxLevel: 15
                    zoneType: Indoor
                    bonusTypeId: 2ca1653f-5610-41d4-b131-7d6ba4b75448
                    bonus: tribute
                    bonusLabel: Tribute
                    state: ACTIVE
                    bonusDate: '2026-11-11'
                    pendingRemovalBy: null
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadDate'
        '404':
          $ref: '#/components/responses/ServerNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/servers/{server}/bonuses/history/logs:
    get:
      tags: [ Bonuses ]
      operationId: getBonusActionsOnDate
      security: []
      summary: Everything people did to bonuses on a day
      description: |
        Each report, removal and other action for that bonus day, with who did it. Reports sent with an API key have
        `metadata.source` set to `client_log_signal`.
      parameters:
        - $ref: '#/components/parameters/Server'
        - name: date
          in: query
          required: true
          description: The bonus day, in the sense of [the bonus day](#section/The-bonus-day).
          schema:
            type: string
            format: date
            examples: [ '2026-11-10' ]
      responses:
        '200':
          description: The actions, oldest first.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/BonusAction'
              example:
                ok: true
                data:
                  - id: 00000000-0000-4000-8000-000000000001
                    serverId: 1
                    zoneId: be27703f-28c8-4fde-ad5d-6fb3e691e070
                    zoneBonusId: 24c0ef76-a47f-4b16-8709-79d27f0130ca
                    bonusTypeId: fa365f41-8ec6-4a1a-96ec-d42f651bd01e
                    actorId: 00000000-0000-4000-8000-000000000002
                    actionType: ADD
                    bonusDate: '2026-11-10T00:00:00.000Z'
                    reason: null
                    metadata:
                      source: client_log_signal
                      bonusKey: aa
                    createdAt: '2026-11-10T09:26:20.200Z'
                    actor:
                      id: 00000000-0000-4000-8000-000000000002
                      username: ExampleUser
                      role: MEMBER
                    zone:
                      id: be27703f-28c8-4fde-ad5d-6fb3e691e070
                      slug: wall-of-slaughter
                      name: Wall of Slaughter
                      expansionId: 935d6206-7c25-4559-a321-406a8648d584
                      minLevel: 65
                      maxLevel: 75
                      zoneType: null
                      legacyZoneId: null
                      isActive: true
                      createdAt: '2026-07-24T15:57:13.740Z'
                      updatedAt: '2026-07-24T15:57:13.740Z'
                    bonusType:
                      id: fa365f41-8ec6-4a1a-96ec-d42f651bd01e
                      key: aa
                      label: AA
                      sortOrder: 20
                      isSystem: true
                      createdAt: '2026-05-21T01:14:20.470Z'
                      updatedAt: '2026-11-13T01:37:57.738Z'
                    isReportable: true
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          description: '`date` is missing or isn''t a date.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                missing:
                  value:
                    ok: false
                    error: Query string date is required
                malformed:
                  value:
                    ok: false
                    error: Date must be formatted as YYYY-MM-DD
        '404':
          $ref: '#/components/responses/ServerNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/servers/{server}/bonuses/zones/{zoneSlug}/history:
    get:
      tags: [ Bonuses ]
      operationId: getZoneBonusHistory
      security: []
      summary: One zone's bonus on every day it was reported
      parameters:
        - $ref: '#/components/parameters/Server'
        - name: zoneSlug
          in: path
          required: true
          description: A zone's `slug` from `zones`.
          schema:
            type: string
            examples: [ befallen ]
      responses:
        '200':
          description: The zone, its history, newest first, and how often it had each bonus.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ZoneBonusHistory'
              example:
                ok: true
                data:
                  zone:
                    id: c9b0852f-cacd-48f8-8cab-affb47b5b4c0
                    slug: befallen
                    name: Befallen
                    expansionId: 1d0ee73f-7e7a-46bf-b691-8d3424751ab5
                    expansion: Classic
                    expansionSlug: classic
                    minLevel: 5
                    maxLevel: 20
                    zoneType: Indoor
                    legacyZoneId: 2
                    isActive: true
                    createdAt: '2026-05-22T21:09:57.304Z'
                    updatedAt: '2026-05-22T21:09:57.304Z'
                  history:
                    - id: 53425c74-8813-49d5-a510-0e30000e06e0
                      bonusDate: '2026-11-12'
                      bonus: none
                      bonusLabel: No Bonus
                      state: ACTIVE
                  stats:
                    - bonusTypeId: 5cd4260c-9531-48d5-9b62-a9dfc9c6ed21
                      bonus: rare
                      bonusLabel: Rare Spawn
                      count: 47
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          description: No server, or no zone with that slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                server:
                  value:
                    ok: false
                    error: Server not found
                zone:
                  value:
                    ok: false
                    error: Zone not found
        '500':
          $ref: '#/components/responses/ServerError'
  /api/servers/{server}/bonuses/zones/trends:
    get:
      tags: [ Bonuses ]
      operationId: getZoneBonusTrends
      security: []
      summary: How often each zone has had each bonus
      description: Every zone on the server, with a count of the days it had each bonus type.
      parameters:
        - $ref: '#/components/parameters/Server'
        - name: expansion
          in: query
          description: |
            Only zones from these expansions. Repeat the parameter for more than one. Uses the expansion's display
            name, such as `Ruins of Kunark`, not its slug; an unknown name matches no zones.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
            examples: [ [ Classic, Ruins of Kunark ] ]
        - name: startDate
          in: query
          description: Count only days on or after this bonus day.
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: Count only days on or before this bonus day.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The counts.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ZoneBonusTrends'
              example:
                ok: true
                data:
                  bonusTypes:
                    - id: 87b99f7c-af3e-4b01-96ed-b8ec015612f1
                      key: experience
                      label: Experience
                      sortOrder: 10
                  zones:
                    - id: 8de71326-2b5a-4db2-b5fa-348ff0ab24a8
                      slug: akanon
                      name: "Ak'Anon"
                      expansion: Classic
                      expansionId: 1d0ee73f-7e7a-46bf-b691-8d3424751ab5
                      expansionSlug: classic
                      minLevel: 1
                      maxLevel: 15
                      zoneType: Indoor
                      counts:
                        experience: 0
                        rare: 1
                        none: 78
                      total: 90
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadDate'
        '404':
          $ref: '#/components/responses/ServerNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/client/bonuses:
    post:
      tags: [ Client ]
      operationId: reportBonus
      summary: Report today's bonus in a zone
      description: |
        Reports the bonus for today, in the sense of [the bonus day](#section/The-bonus-day). Server names, zone names
        and bonus keys are matched regardless of case.

        Sending the same report again is harmless: the site ignores a report that doesn't change anything, and says so
        with `updated: false`.

        Bans and timeouts on the key owner's account apply here just as they do on the website.
      security:
        - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BonusReport'
            example:
              serverName: Fangbreaker
              zoneName: Bastion of Thunder
              bonusKey: experience
      responses:
        '200':
          description: The report was accepted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BonusReportResult'
              example:
                ok: true
                data:
                  updated: false
                  zoneBonus:
                    id: c460f872-a5c2-455f-b63f-22ed6edbd7f4
                    serverId: 1
                    zoneId: 6488a2c2-e609-437d-8758-957e1b07732c
                    bonusTypeId: 5cd4260c-9531-48d5-9b62-a9dfc9c6ed21
                    bonusDate: '2026-11-12T00:00:00.000Z'
                    state: ACTIVE
                    createdById: 00000000-0000-4000-8000-000000000003
                    removedById: null
                    removedAt: null
                    legacyBonusId: null
                    createdAt: '2026-11-12T18:45:41.720Z'
                    updatedAt: '2026-11-12T18:45:41.720Z'
        '400':
          description: |
            A field is missing or isn't a string, or the bonus key isn't one of the server's bonus types. `unconfirmed`
            counts as not one of them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                missing:
                  value:
                    ok: false
                    error: serverName, zoneName, and bonusKey are required
                bonus:
                  value:
                    ok: false
                    error: Bonus type is not enabled for this server
        '401':
          $ref: '#/components/responses/ApiKeyRequired'
        '403':
          description: The key owner's account is banned or timed out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: |
            No server with that name, or the zone isn't on that server's list. A zone that's only on another server's
            list gets this too.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                server:
                  value:
                    ok: false
                    error: Server not found
                zone:
                  value:
                    ok: false
                    error: Zone not found or not enabled for this server
        '500':
          $ref: '#/components/responses/ServerErrorOrBadJson'
  /api/client/encounters/finalized:
    post:
      tags: [ Client ]
      operationId: uploadEncounter
      summary: Upload a finished raid encounter
      description: |
        Uploads the damage and healing summary of one fight, as parsed from the key owner's EverQuest log. The site
        adds it to a report, which then appears in the raid-parse operations.

        Field names are snake_case, unlike the rest of the API.

        The success response isn't documented: fzClient ignores it and checks only the status code. Not verified
        against the live API.
      security:
        - ApiKey: []
      parameters:
        - name: X-Guild-Code
          in: header
          description: |
            A guild's upload code, to credit the encounter to that guild's official logs. Leave it out for personal
            uploads. Guild officers manage upload codes on the website.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncounterSummaryUpload'
      responses:
        '2XX':
          description: The encounter was accepted.
        '401':
          $ref: '#/components/responses/ApiKeyRequired'
        '403':
          description: The key owner's account is banned or timed out. Not verified against the live API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerErrorOrBadJson'

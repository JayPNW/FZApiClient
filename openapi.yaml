components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Each user creates their own key on the site's account page, after signing in with Discord. Keys begin with
        `fz_live_`. The site shows the full key only once, when it's created or rotated; rotating or revoking a key
        stops the old one from working.
    Session:
      type: apiKey
      in: cookie
      name: fz.sid
      description: The session cookie. `GET /api/auth/discord` starts a Discord sign-in, and the site sets the cookie. It is HttpOnly, Secure and SameSite=Lax, so it is meant for browsers.
  headers:
    ETag:
      description: A weak validator for the response. Send it in `If-None-Match` to get `304` when nothing has changed.
      schema:
        type: string
        examples: [ 'W/"421-4TTIb7DNmX7H9zsTRc6FpQtEstU"' ]
  parameters:
    Server:
      name: server
      in: path
      required: true
      description: A server's `slug` from `GET /api/servers`. Case doesn't matter.
      schema:
        type: string
        examples: [ fangbreaker, frostreaver ]
    EncounterId:
      name: id
      in: path
      required: true
      description: An encounter `id`.
      schema:
        type: string
        format: uuid
    ReportId:
      name: id
      in: path
      required: true
      description: A report `id`.
      schema:
        type: string
        format: uuid
    CharacterId:
      name: id
      in: path
      required: true
      description: A character `id`.
      schema:
        type: string
        format: uuid
    GuildId:
      name: guild
      in: path
      required: true
      description: A guild `id` from `GET /api/guilds`. The `slug` is not accepted.
      schema:
        type: string
        format: uuid
    Boss:
      name: boss
      in: path
      required: true
      description: A raid boss `id`.
      schema:
        type: string
        format: uuid
    ParseMetric:
      name: metric
      in: query
      description: Whether to use damage or healing parses. The default is `DAMAGE`.
      schema:
        $ref: "#/components/schemas/ParseMetric"
    RankServerId:
      name: serverId
      in: query
      required: true
      description: A server `id` from `GET /api/servers`.
      schema:
        type: integer
    RankingPartitionId:
      name: rankingPartitionId
      in: query
      required: true
      description: A ranking partition's `rankingPartitionId` from `GET /api/servers/{server}/progression`.
      schema:
        type: string
        format: uuid
    ExpansionId:
      name: expansionId
      in: query
      description: Only this expansion. An expansion `id`.
      schema:
        type: string
        format: uuid
    RankMetric:
      name: metric
      in: query
      description: Damage or healing. The default is `DAMAGE`.
      schema:
        $ref: "#/components/schemas/ParseMetric"
    SnapshotDate:
      name: snapshotDate
      in: query
      description: Show the standings from a past snapshot. Not verified against the live API.
      schema:
        type: string
        format: date
    RankLimit:
      name: limit
      in: query
      description: How many results to return.
      schema:
        type: integer
        minimum: 1
    RankPage:
      name: page
      in: query
      description: Which page of results, starting at 1.
      schema:
        type: integer
        minimum: 1
    ClassName:
      name: className
      in: query
      description: Only this class, such as `Cleric`.
      schema:
        type: string
    ReportLimit:
      name: limit
      in: query
      description: The most reports to return.
      schema:
        type: integer
        minimum: 1
    ReportServerSlug:
      name: serverSlug
      in: query
      description: Only reports on this server.
      schema:
        type: string
    ReportServerId:
      name: serverId
      in: query
      description: Only reports on this server. A server `id`.
      schema:
        type: integer
    ReportGuildId:
      name: guildId
      in: query
      description: Only reports of this guild. A guild `id`.
      schema:
        type: string
        format: uuid
  responses:
    NotModified:
      description: The request's `If-None-Match` matches the current `ETag`, so there's no body.
    ServerNotFound:
      description: No server with that name.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            ok: false
            error: Server not found
    ServerError:
      description: Something went wrong on the site.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            ok: false
            error: Internal server error
    BadDate:
      description: A date isn't formatted as `YYYY-MM-DD`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            ok: false
            error: Date must be formatted as YYYY-MM-DD
    ApiKeyRequired:
      description: The `X-API-Key` header is missing or empty, or the key isn't valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            missing:
              value:
                ok: false
                error: Missing X-API-Key header
            invalid:
              value:
                ok: false
                error: Invalid API key
    ServerErrorOrBadJson:
      description: Something went wrong on the site. A body that isn't valid JSON currently gets this response, not `400`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            ok: false
            error: Internal server error
    NotFound:
      description: Nothing with that ID. The `error` says what, such as `Report not found`, `Encounter not found`, `Character not found` or `Guild not found`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            ok: false
            error: Report not found
    BadRequest:
      description: A query parameter is missing or not valid. The `error` says which.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            ok: false
            error: rankingPartitionId is required
    Unauthorized:
      description: The request has no session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            ok: false
            error: Authentication is required
  schemas:
    SuccessEnvelope:
      type: object
      required: [ ok, data ]
      properties:
        ok:
          const: true
        data: {}
    ErrorEnvelope:
      type: object
      required: [ ok, error ]
      properties:
        ok:
          const: false
        error:
          type: string
          description: What went wrong, for a person to read.
    Health:
      type: object
      required: [ ok, status ]
      properties:
        ok:
          const: true
        status:
          type: string
          examples: [ healthy ]
    Server:
      type: object
      required: [ id, name, slug, aliases, isActive, createdAt, updatedAt ]
      properties:
        id:
          type: integer
          description: Matches `serverId` in a report's result.
        name:
          type: string
          description: The name to use as `serverName` when reporting.
          examples: [ Fangbreaker ]
        slug:
          type: string
          description: The name to use in paths.
          examples: [ fangbreaker ]
        aliases:
          type: array
          description: Other names for the server.
          items:
            type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BonusKey:
      type: string
      description: |
        A bonus type's `key`. The list differs between servers and can change, so get it from
        `GET /api/servers/{server}/bonuses/types` instead of hard-coding it. Keys in use are `experience`, `aa`,
        `item-exp`, `mercenary-exp`, `loot`, `coin`, `rare`, `faction`, `respawn`, `tribute`, `tradeskill` and `none`,
        plus `unconfirmed`, which only appears in `today`.
      examples: [ experience, none ]
    BonusType:
      type: object
      required: [ id, key, label, sortOrder ]
      properties:
        id:
          type: string
          format: uuid
        key:
          $ref: '#/components/schemas/BonusKey'
        label:
          type: string
          description: For display.
          examples: [ Rare Spawn ]
        sortOrder:
          type: integer
          description: Lower numbers come first when displayed.
    Zone:
      description: A zone, with its expansion's name.
      allOf:
        - $ref: '#/components/schemas/ZoneRecord'
        - type: object
          required: [ expansion, expansionSlug ]
          properties:
            expansion:
              type: string
              description: The expansion's name, for display.
              examples: [ Classic, Ruins of Kunark ]
            expansionSlug:
              type: string
              examples: [ classic, ruins-of-kunark ]
    ZoneRecord:
      description: A zone as the site stores it.
      type: object
      required:
        - id
        - slug
        - name
        - expansionId
        - minLevel
        - maxLevel
        - zoneType
        - legacyZoneId
        - isActive
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          examples: [ befallen ]
        name:
          type: string
          description: The name to use as `zoneName` when reporting.
          examples: [ Befallen, "Ak'Anon", 'Ikkinz: Chambers of Destruction', 'Barindu, Hanging Gardens' ]
        expansionId:
          type: string
          format: uuid
        minLevel:
          $ref: '#/components/schemas/Level'
        maxLevel:
          $ref: '#/components/schemas/Level'
        zoneType:
          $ref: '#/components/schemas/ZoneType'
        legacyZoneId:
          type: [ integer, 'null' ]
          description: The zone's ID on the site before zones had UUIDs. Null for zones added since.
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Level:
      type: [ integer, 'null' ]
      description: A level bound for the zone. Null when the zone has no bound on that side.
    ZoneType:
      type: [ string, 'null' ]
      description: '`Indoor`, `Outdoor`, or null when not known.'
      examples: [ Indoor, Outdoor ]
    ZoneBonusToday:
      type: object
      required:
        - id
        - zoneId
        - zoneSlug
        - name
        - expansion
        - expansionId
        - expansionSlug
        - minLevel
        - maxLevel
        - zoneType
        - bonusTypeId
        - bonus
        - bonusLabel
        - state
        - bonusDate
        - pendingRemovalBy
      properties:
        id:
          type: [ string, 'null' ]
          format: uuid
          description: The zone bonus's ID. Null when nobody has reported the zone today.
        zoneId:
          type: string
          format: uuid
          description: Matches a zone's `id` from `zones`.
        zoneSlug:
          type: string
          description: Matches a zone's `slug` from `zones`.
        name:
          type: string
          description: Matches a zone's `name` from `zones`.
        expansion:
          type: string
        expansionId:
          type: string
          format: uuid
        expansionSlug:
          type: string
        minLevel:
          $ref: '#/components/schemas/Level'
        maxLevel:
          $ref: '#/components/schemas/Level'
        zoneType:
          $ref: '#/components/schemas/ZoneType'
        bonusTypeId:
          type: [ string, 'null' ]
          format: uuid
          description: Matches a bonus type's `id` from `types`. Null when nobody has reported the zone today.
        bonus:
          $ref: '#/components/schemas/BonusKey'
        bonusLabel:
          type: string
          description: For display.
        state:
          $ref: '#/components/schemas/ZoneBonusState'
        bonusDate:
          type: string
          format: date
          description: The day the bonus is for, in the sense of [the bonus day](#section/The-bonus-day).
        pendingRemovalBy:
          description: Reserved for the site's removal process. Currently always null; clients should ignore it.
    ZoneBonusState:
      type: string
      description: |
        - `ACTIVE`: someone reported this bonus today. This includes a report of `none`.
        - `UNCONFIRMED`: nobody has reported the zone today.

        Clients should treat any other value as `UNCONFIRMED`.
      examples: [ ACTIVE, UNCONFIRMED ]
    BonusReport:
      type: object
      required: [ serverName, zoneName, bonusKey ]
      properties:
        serverName:
          type: string
          description: A server's `name` from `GET /api/servers`, capitalized as it is there.
          examples: [ Fangbreaker, Frostreaver ]
        zoneName:
          type: string
          description: A zone's `name` from `GET /api/servers/{server}/bonuses/zones`.
          examples: [ Bastion of Thunder ]
        bonusKey:
          allOf:
            - $ref: '#/components/schemas/BonusKey'
          description: A `key` from `GET /api/servers/{server}/bonuses/types`, including `none` for no bonus. Not `unconfirmed`.
    BonusReportResult:
      type: object
      required: [ updated, zoneBonus ]
      properties:
        updated:
          type: boolean
          description: False when the site already showed this bonus for the zone, so nothing changed.
        zoneBonus:
          description: The zone's bonus after the report. Can be empty.
          anyOf:
            - $ref: '#/components/schemas/ZoneBonus'
            - type: object
              maxProperties: 0
    ZoneBonus:
      type: object
      description: One zone's bonus on one day, as the site stores it.
      required:
        - id
        - serverId
        - zoneId
        - bonusTypeId
        - bonusDate
        - state
        - createdById
        - removedById
        - removedAt
        - legacyBonusId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Matches `id` in `today`.
        serverId:
          type: integer
          description: Matches a server's `id` from `GET /api/servers`.
        zoneId:
          type: string
          format: uuid
        bonusTypeId:
          type: string
          format: uuid
        bonusDate:
          $ref: '#/components/schemas/BonusDateTime'
        state:
          $ref: '#/components/schemas/ZoneBonusState'
        createdById:
          type: string
          format: uuid
          description: The user who first reported this bonus.
        removedById:
          type: [ string, 'null' ]
          format: uuid
          description: The user who removed this bonus, if anyone did.
        removedAt:
          type: [ string, 'null' ]
          format: date-time
        legacyBonusId:
          type: [ integer, 'null' ]
          description: The bonus's ID on the site before bonuses had UUIDs. Null for bonuses added since.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BonusDateTime:
      type: string
      format: date-time
      description: A [bonus day](#section/The-bonus-day), as midnight UTC on that date. Only the date part means anything.
      examples: [ '2026-11-12T00:00:00.000Z' ]
    BonusTypeRecord:
      description: A bonus type with the site's bookkeeping fields.
      allOf:
        - $ref: '#/components/schemas/BonusType'
        - type: object
          required: [ isSystem, createdAt, updatedAt ]
          properties:
            isSystem:
              type: boolean
              description: True for the bonus types built into the site.
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    UserSummary:
      type: object
      description: Who did something. Public.
      required: [ id, username, role ]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          description: The user's display name on the site.
        role:
          $ref: '#/components/schemas/UserRole'
    BonusAction:
      type: object
      description: Something a user or the site did to a zone's bonus.
      required:
        - id
        - serverId
        - zoneId
        - zoneBonusId
        - bonusTypeId
        - actorId
        - actionType
        - bonusDate
        - reason
        - metadata
        - createdAt
        - actor
        - zone
        - bonusType
        - isReportable
      properties:
        id:
          type: string
          format: uuid
        serverId:
          type: integer
        zoneId:
          type: string
          format: uuid
        zoneBonusId:
          type: [ string, 'null' ]
          format: uuid
          description: The `id` of the zone bonus the action was about.
        bonusTypeId:
          type: [ string, 'null' ]
          format: uuid
        actorId:
          type: string
          format: uuid
        actionType:
          $ref: '#/components/schemas/BonusActionType'
        bonusDate:
          $ref: '#/components/schemas/BonusDateTime'
        reason:
          type: [ string, 'null' ]
          description: Why, when the action needs a reason, such as a moderator's removal.
        metadata:
          type: [ object, 'null' ]
          description: Extra details. Reports carry `bonusKey`; reports sent with an API key also carry `source`.
          properties:
            bonusKey:
              $ref: '#/components/schemas/BonusKey'
            source:
              type: string
              examples: [ client_log_signal ]
        createdAt:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/UserSummary'
        zone:
          $ref: '#/components/schemas/ZoneRecord'
        bonusType:
          oneOf:
            - $ref: '#/components/schemas/BonusTypeRecord'
            - type: 'null'
        isReportable:
          type: boolean
          description: Whether users can report this action to moderators.
    BonusActionType:
      type: string
      description: |
        - `ADD`: reported a bonus.
        - `REMOVE`: removed a bonus.
        - `FLAG_REMOVAL`, `CONFIRM_REMOVAL`, `CANCEL_REMOVAL`: steps in asking for a bonus to be removed.
        - `ADMIN_REMOVE`, `ADMIN_RESTORE`: a moderator removed or restored a bonus.
        - `REPORT`: reported another action to moderators.
        - `IMPORT`: brought in from the site's earlier data.
      enum: [ ADD, REMOVE, FLAG_REMOVAL, CONFIRM_REMOVAL, CANCEL_REMOVAL, ADMIN_REMOVE, ADMIN_RESTORE, REPORT, IMPORT ]
    ZoneBonusHistory:
      type: object
      required: [ zone, history, stats ]
      properties:
        zone:
          $ref: '#/components/schemas/Zone'
        history:
          type: array
          description: Newest first.
          items:
            type: object
            required: [ id, bonusDate, bonus, bonusLabel, state ]
            properties:
              id:
                type: string
                format: uuid
              bonusDate:
                type: string
                format: date
              bonus:
                $ref: '#/components/schemas/BonusKey'
              bonusLabel:
                type: string
              state:
                $ref: '#/components/schemas/ZoneBonusState'
        stats:
          type: array
          description: How many days the zone had each bonus. Bonus types it never had are left out.
          items:
            type: object
            required: [ bonusTypeId, bonus, bonusLabel, count ]
            properties:
              bonusTypeId:
                type: string
                format: uuid
              bonus:
                $ref: '#/components/schemas/BonusKey'
              bonusLabel:
                type: string
              count:
                type: integer
    ZoneBonusTrends:
      type: object
      required: [ bonusTypes, zones ]
      properties:
        bonusTypes:
          type: array
          description: The server's bonus types, as from `types`.
          items:
            $ref: '#/components/schemas/BonusType'
        zones:
          type: array
          items:
            type: object
            required:
              - id
              - slug
              - name
              - expansion
              - expansionId
              - expansionSlug
              - minLevel
              - maxLevel
              - zoneType
              - counts
              - total
            properties:
              id:
                type: string
                format: uuid
              slug:
                type: string
              name:
                type: string
              expansion:
                type: string
              expansionId:
                type: string
                format: uuid
              expansionSlug:
                type: string
              minLevel:
                $ref: '#/components/schemas/Level'
              maxLevel:
                $ref: '#/components/schemas/Level'
              zoneType:
                $ref: '#/components/schemas/ZoneType'
              counts:
                type: object
                description: For each of the server's bonus keys, how many days the zone had that bonus.
                additionalProperties:
                  type: integer
              total:
                type: integer
                description: The number of days counted.
    EncounterSummaryUpload:
      type: object
      description: One fight's summary, as fzClient sends it.
      required: [ event, encounter_id, target_name, zone, started_at, ended_at, duration_sec, participants ]
      properties:
        event:
          const: encounter_summary
        encounter_id:
          type: string
          description: The client's own ID for the fight, unique per upload. fzClient sends a UUID without dashes.
          examples: [ 5f0c3a3e2f5c4d4fa1f4f8f7f3c7a9b1 ]
        target_name:
          type: string
          description: The main enemy in the fight.
        zone:
          type: string
          description: The zone name from the log, or `unknown`.
        character_name:
          type: string
          description: The character whose log this is.
        character:
          type: string
          description: The same as `character_name`.
        server_name:
          type: string
          description: The EverQuest server the character is on.
          examples: [ Frostreaver ]
        server:
          type: string
          description: The same as `server_name`.
        character_class:
          $ref: '#/components/schemas/EqClassOrEmpty'
        character_class_source:
          type: string
          description: '`client_manual` when the user set `character_class` in the client; otherwise empty.'
          examples: [ client_manual ]
        character_class_confidence:
          type: number
          description: 1 when `character_class` is set; otherwise 0.
        character_class_evidence:
          type: array
          items:
            type: string
            examples: [ client_setting ]
        client_version:
          type: string
          examples: [ 1.2.6 ]
        report_name:
          type: string
          description: The report to add the encounter to, by name. Empty to let the site choose.
        client_provenance:
          oneOf:
            - $ref: '#/components/schemas/ClientProvenance'
            - type: 'null'
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        duration_sec:
          type: number
        total_damage:
          type: integer
        dps:
          type: number
        total_healing:
          type: integer
        hps:
          type: number
        participants:
          type: array
          items:
            $ref: '#/components/schemas/EncounterParticipantUpload'
        class_evidence:
          type: array
          description: Lines in the log that suggest a character's class.
          items:
            $ref: '#/components/schemas/ClassEvidenceUpload'
    EncounterParticipantUpload:
      type: object
      required: [ name, damage, dps, healing, hps, is_player ]
      properties:
        name:
          type: string
        damage:
          type: integer
        dps:
          type: number
        healing:
          type: integer
        hps:
          type: number
        top_ability:
          type: string
        top_heal_ability:
          type: string
        hit_count:
          type: integer
        heal_count:
          type: integer
        crit_pct:
          type: number
        heal_crit_pct:
          type: number
        is_player:
          type: boolean
          description: False for a known pet.
        owner:
          type: [ string, 'null' ]
          description: A pet's owner, when known.
    ClassEvidenceUpload:
      type: object
      required: [ character_name, suggested_class, source, confidence, evidence_type, evidence_text, tier ]
      properties:
        character_name:
          type: string
        suggested_class:
          $ref: '#/components/schemas/EqClass'
        source:
          type: string
          examples: [ log_detected ]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        evidence_type:
          type: string
          examples: [ combat_skill, class_ability, spell, song ]
        evidence_text:
          type: string
          examples: [ Backstab ]
        tier:
          type: string
          examples: [ HARD_EXCLUSIVE, STRONG_EXCLUSIVE ]
    ClientProvenance:
      type: object
      description: How the client read the log, so the site can tell live play from replayed or edited logs.
      required: [ session_id, mode, started_at_utc, last_observed_at_utc, eligibility, is_upload_eligible ]
      properties:
        session_id:
          type: string
          description: The client's ID for this log session.
        mode:
          type: string
          enum: [ Live, Replay ]
        started_at_utc:
          type: string
          format: date-time
        last_observed_at_utc:
          type: string
          format: date-time
        first_observed_at_utc:
          type: [ string, 'null' ]
          format: date-time
        last_line_observed_at_utc:
          type: [ string, 'null' ]
          format: date-time
        first_log_timestamp:
          type: [ string, 'null' ]
          format: date-time
        last_log_timestamp:
          type: [ string, 'null' ]
          format: date-time
        lines_observed:
          type: integer
        timestamped_lines:
          type: integer
        parsed_events:
          type: integer
        out_of_order_timestamp_count:
          type: integer
        large_log_gap_count:
          type: integer
        large_receive_gap_count:
          type: integer
        burst_line_count:
          type: integer
        suspicious_burst_count:
          type: integer
        observed_wall_clock_seconds:
          type: number
        log_time_span_seconds:
          type: number
        average_lines_per_second:
          type: number
        average_parsed_events_per_second:
          type: number
        average_log_lines_per_second:
          type: number
        max_lines_per_second:
          type: integer
        trust_score:
          type: number
        eligibility:
          type: string
          enum: [ LiveEligible, LocalReplay, LiveSuspicious ]
        is_upload_eligible:
          type: boolean
    EqClass:
